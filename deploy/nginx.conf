# Add this as a NEW virtual host; keep existing sites unchanged.
# Replace poker.example.com and, if needed, the local upstream port.
# This HTTP bootstrap config can be upgraded to HTTPS by certbot --nginx,
# or configured through an existing server panel with the same proxy headers.
server {
    listen 80;
    server_name poker.example.com;
    client_max_body_size 16k;

    # Production already disables this route; block it at the proxy as well.
    location = /api/llm/test {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
